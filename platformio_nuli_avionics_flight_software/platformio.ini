;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;  Global definition
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[libs]
icm20948 = sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.2.13
fram = adafruit/Adafruit FRAM SPI@^2.6.2
ms8607 = sparkfun/SparkFun PHT MS8607 Arduino Library@^1.0.5
gps = sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.29
rfm95 = jgromes/RadioLib@^7.1.2
median = robtillaart/RunningMedian@^0.3.9
eigen = hideakitai/ArduinoEigen@^0.3.2
watchdog = adafruit/Adafruit SleepyDog Library@^1.6.4

[avionics]
src = +<core/*>
enableSim = -D AVIONICS_ARGUMENT_isSim=true
enableDev = -D AVIONICS_ARGUMENT_isDev=true
V1 = -D AVIONICS_ARGUMENT_boardVersion=1
V2 = -D AVIONICS_ARGUMENT_boardVersion=2
V3 = -D AVIONICS_ARGUMENT_boardVersion=3
firmwareMajor = 1
; Full firmware version is injected by build_tools/build_helpers.py from AVIONICS_FIRMWARE_VERSION.

[arduino_common]
lib_ignore = Eigen    ; lib/Eigen is for desktop only, we get the use the ArduinoEigen lib for firmware

[SAMD21_feather_m0]
extends = arduino_common
platform = atmelsam
build_type = release
framework = arduino
board = adafruit_feather_m0
platform_packages = platformio/tool-openocd@^3.1200.0
debug_tool = atmel-ice
extra_scripts = pre:build_tools/build_helpers.py, post:build_tools/post_uf2.py

[SAMD51_feather_m4]
extends = arduino_common
platform = atmelsam
build_type = release
framework = arduino
board = adafruit_feather_m4
platform_packages = platformio/tool-openocd@^3.1200.0
debug_tool = atmel-ice
extra_scripts = pre:build_tools/build_helpers.py, post:build_tools/post_uf2.py

[SAMD51_grandcentral_m4]
extends = arduino_common
platform = atmelsam
framework = arduino
board = adafruit_grandcentral_m4
platform_packages = platformio/tool-openocd@^3.1200.0
debug_tool = atmel-ice
extra_scripts = pre:build_tools/build_helpers.py, post:build_tools/post_uf2.py

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;  Testing builds
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[env:BasicTestSAMD21]
extends = SAMD21_feather_m0
build_src_filter = +<builds/BasicTest.cpp>

[env:BasicTestSAMD51]
extends = SAMD51_grandcentral_m4
build_src_filter = +<builds/BasicTest.cpp>

[env:EByteTransmitterTest]
extends = SAMD21_feather_m0
build_src_filter = +<builds/EByteTests/EByteTransmitter.cpp>
lib_deps = ${libs.rfm95}

[env:EByteResponderTest]
extends = SAMD21_feather_m0
build_src_filter = +<builds/EByteTests/EByteResponder.cpp>
lib_deps = ${libs.rfm95}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;  Board Flight Code
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[SillyGoose]
extends = SAMD21_feather_m0
board.name = SillyGoose
board.vendor = AerospaceNU
board.url = https://github.com/AerospaceNU/nuli-avionics-flight-software
build_src_filter =
    ${avionics.src}
    +<builds/SillyGoose.cpp>
    +<drivers/arduino/FlashMemoryCommon.cpp>
    +<drivers/arduino/S25FL512.cpp>
    +<drivers/arduino/MX25L256.cpp>
    +<drivers/arduino/Ms5607Mmc5603SensorPackage.cpp>
    +<drivers/arduino/ArduinoPyro.cpp>
    +<drivers/arduino/ArduinoVoltageSensor.cpp>
    +<drivers/arduino/ArduinoFram.cpp>
    +<drivers/arduino/ArduinoWatchdog.cpp>
lib_deps = ${libs.fram}, ${libs.eigen}, ${libs.watchdog}

[env:SillyGooseV1]
extends = SillyGoose
board.build.usb_product = SillyGooseV1
board.build.hwids = [["0x239A", "0x5001"], ["0x239A", "0x000B"], ["0x239A", "0x0015"]]
build_flags = ${avionics.V1}

[env:SillyGooseV1Dev]
extends = env:SillyGooseV1
build_flags = ${avionics.V1} ${avionics.enableDev}

[env:SillyGooseV1Sim]
extends = env:SillyGooseV1
build_flags = ${avionics.V1} ${avionics.enableSim} ${avionics.enableDev}

[env:SillyGooseV2]
extends = SillyGoose
board.build.usb_product = SillyGooseV2
board.build.hwids = [["0x239A", "0x5002"], ["0x239A", "0x000B"], ["0x239A", "0x0015"]]
build_flags = ${avionics.V2}

[env:SillyGooseV2Dev]
extends = env:SillyGooseV2
build_flags = ${avionics.V2} ${avionics.enableDev}

[env:SillyGooseV2Sim]
extends = env:SillyGooseV2
build_flags = ${avionics.V2} ${avionics.enableSim} ${avionics.enableDev}

[SeriousGoose]
extends = SAMD51_feather_m4
board.name = SeriousGoose
board.vendor = AerospaceNU
board.url = https://github.com/AerospaceNU/nuli-avionics-flight-software
build_src_filter =
    ${avionics.src}
    +<builds/SeriousGoose.cpp>
    +<drivers/arduino/FlashMemoryCommon.cpp>
    +<drivers/arduino/MX25L256.cpp>
    +<drivers/arduino/Ms5607Mmc5603SensorPackage.cpp>
    +<drivers/arduino/ArduinoPyro.cpp>
    +<drivers/arduino/ArduinoVoltageSensor.cpp>
    +<drivers/arduino/ArduinoFram.cpp>
    +<drivers/arduino/UBloxV2.cpp>
    +<drivers/arduino/SX1262Radio.cpp>
    +<drivers/arduino/ArduinoWatchdog.cpp>
lib_deps = ${libs.fram}, ${libs.eigen}, ${libs.gps}, ${libs.rfm95}, ${libs.watchdog}

[env:SeriousGooseV1]
extends = SeriousGoose
board.build.usb_product = SeriousGooseV1
board.build.hwids = [["0x239A", "0x5003"], ["0x239A", "0x0031"], ["0x239A", "0x0032"]]
build_flags = ${avionics.V1}

[env:SeriousGooseV1Dev]
extends = env:SeriousGooseV1
build_flags = ${avionics.V1} ${avionics.enableDev}

[env:SeriousGooseV1Sim]
extends = env:SeriousGooseV1
build_flags = ${avionics.V1} ${avionics.enableSim} ${avionics.enableDev}

[SeriousGooseGround]
extends = SAMD51_feather_m4
board.name = SeriousGooseGround
board.vendor = AerospaceNU
board.url = https://github.com/AerospaceNU/nuli-avionics-flight-software
build_src_filter =
    ${avionics.src}
    +<builds/SeriousGooseGround.cpp>
    +<drivers/arduino/ArduinoFram.cpp>
    +<drivers/arduino/UBloxV2.cpp>
    +<drivers/arduino/SX1262Radio.cpp>
lib_deps = ${libs.fram}, ${libs.eigen}, ${libs.gps}, ${libs.rfm95}

[env:SeriousGooseGroundV1]
extends = SeriousGooseGround
board.build.usb_product = SeriousGooseGroundV1
board.build.hwids = [["0x239A", "0x5004"], ["0x239A", "0x0031"], ["0x239A", "0x0032"]]
build_flags = ${avionics.V1}